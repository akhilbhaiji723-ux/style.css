<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form of CAREER TECH ACADEMY</title>

    
    <link rel="stylesheet" href="adimison.css">
</head>

<body>

    
    <header class="header">

        <div class="ministry">
            <div class="emblem"></div>
            <div>
                <em><b>CAREER TECH ACADEMY</b>
                <span>& INSTITUTE</span></em>
            </div>
        </div>
        <div class="logo"><img src="./ctaimage/logoc.png" alt="Emblem"></div>

        <h2>ADMISSION FORM--(2026)</h2>

        <div class="nta">
            <div class="logo2"><img src="./ctaimage/logoc.png" alt="Emblem"></div>
            <div>
                <em><b>CAREER TECH ACADEMY</b></em>
                <i>& INSTITUTE</i>
                <small></small>
            </div>
        </div>

    </header>


    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html"><div class="home">⌂ Home</div></a>
    </nav>


    <!-- Main Container -->
    <main class="container">

        <!-- Personal Details -->
        <section>

            <h3>Personal Details</h3>

            <div class="form-row">
                <label>Student Name</label>
                <input
                                    type="text"
                                    id="candidate_name"
                                    name="candidate_name"
                                    placeholder="Enter your name"
                                    required>
            </div>

            <div class="form-row">
                <label>Father's Name</label>
                <input
                                    type="text"
                                    id="father_name"
                                    name="father_name"
                                    placeholder="Enter your  Father's Name"
                                    required>
            </div>

            <div class="form-row">
                <label>Mother's Name</label>
                <input
                                    type="text"
                                    id="mother_name"
                                    name="mother_name"
                                    placeholder="Enter your Mother's Name"
                                    required>
            </div>

            <div class="form-row">
                <label>Candidate Date of Birth</label>

                <div class="dob">
                    <input type="date">
                </div>
            </div>

            <div class="form-row">
                <label>Gender</label>
                <select>
                    <option>--Select--</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-row">
                <label>Identity Type</label>
                <select>
                    <option>--Select--</option>
                    <option>Aadhaar Card</option>
                    <option>Passport</option>
                    <option>Voter ID</option>
                </select>
            </div>

            <div class="form-row">
                <label>Identification Number</label>
                <input type="text">
            </div>

        </section>


        
        <section>

            <h3>Present Address</h3>

            <div class="form-row">
                <label>address</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>City</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>State</label>
                <input type="text">
            </div>

            
                </select>
            </div>

        </section>

    </main>

</body>
</html>
